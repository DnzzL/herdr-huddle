id = "dnzzl.herdr-huddle"
name = "Herdr Huddle"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Turn a live agent session into a GitHub draft PR two people can plan in"
platforms = ["linux", "macos"]

# Without this, `herdr plugin install` clones the repository, registers nothing
# to build the binary, and the startup hook below then fails on a missing
# bin/herdr-huddle. Build commands run at install time in the plugin root, and
# get none of the runtime plugin environment — so this has to be self-contained,
# which `make build` is.
#
# Deliberately no CLIENT_ID here. It is one OAuth App per person, not one per
# plugin, so the binary reads HERDR_HUDDLE_CLIENT_ID at runtime instead; baking
# one in at install time would hand every user the same app.
[[build]]
command = ["make", "build"]
platforms = ["linux", "macos"]

# Startup hooks are one-shot: they run once per enabled plugin after the session
# is restored and the API socket is ready, and again when a new server takes over
# during a live handoff. The poller has to outlive that, so the hook detaches it
# and exits — see hooks/startup.sh and docs/adr/ADR-001.
[[startup]]
command = ["/bin/sh", "hooks/startup.sh"]

# Deux points d'entrée dans l'interface de Herdr, parce qu'une action arrive
# avec le pane et le projet que la ligne de commande doit deviner (ADR-009).
# Le répertoire courant d'une action est la racine du plugin, jamais celle du
# projet : les deux commandes résolvent leur cible depuis le pane.
[[actions]]
id = "share"
title = "Herdr Huddle: ouvrir le fil de ce projet"
contexts = ["workspace"]
command = ["bin/herdr-huddle", "share"]
platforms = ["linux", "macos"]

# --notify parce que la sortie d'une action ne va qu'au journal du plugin :
# sans lui, le lien de jointure n'atteindrait personne.
[[actions]]
id = "huddle"
title = "Herdr Huddle: ouvrir le huddle sur ce pane"
contexts = ["workspace"]
command = ["bin/herdr-huddle", "serve", "--notify"]
platforms = ["linux", "macos"]
